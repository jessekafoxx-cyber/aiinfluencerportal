openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: storage
    description: Object storage operations
  - name: roadmap
    description: Personalized Apex Roadmap lead-magnet operations (public)
  - name: queue-health-admin
    description: |
      Admin-only Ad Research Board queue-health and queue-trends
      operations mounted under `/api/admin/ad-research-board/*`.
      These endpoints power the Queue Health dashboard panel for
      operators (Clerk session + ADMIN_EMAILS allow-list). Both
      portal artifacts currently consume them through manual
      `api.ts` helpers (Awaited<ReturnType> typing); the spec
      entries here are the source-of-truth contract.
  - name: roadmap-admin
    description: |
      Admin-only Personalized Apex Roadmap operations. These endpoints
      require an authenticated admin (Clerk session + ADMIN_EMAILS
      allow-list) and are mounted under `/api/portal/admin/roadmap/*`. The
      admin UI in the course-portal artifact is a deliberate exception to
      the OpenAPI-first workflow today: it still uses the portal's Clerk
      bearer-token `fetchApi` helper instead of the generated React Query
      hooks. The route is included in this spec so the contract is the
      single source of truth, even though only the response shape is
      currently consumed by the UI.
  - name: fb-cookies-admin
    description: |
      Admin-only management of the Facebook cookies.txt jar used by
      yt-dlp for authenticated FB extraction. Mounted under
      `/api/portal/admin/fb-cookies`. Requires Clerk session + admin
      role. Cookie bytes never leave the server; only jar metadata is
      ever returned by these endpoints.
  - name: platinum-codes
    description: |
      Platinum Founder Code issuance and redemption (Task #227). Every
      Platinum Club subscriber (orders.upsell3Paid=true) is issued exactly
      one single-use code. Codes can be redeemed for any "main product"
      in the AI Influencer Portfolio product line (isMainProduct flag on the Whop product
      catalog). Buyer-facing endpoints live here; admin visibility +
      revoke live under /portal/admin/users/:userId/platinum-code*.
  - name: influencer-generations-admin
    description: |
      Super-admin "Influencer Generations" console (Task #695). Lists
      every `ai_influencer_jobs` row with buyer + influencer state and
      exposes retry / mark-failed / manual-deliver interventions for
      wedged generations. Mounted under
      `/api/portal/admin/influencer-generations`. Requires Clerk
      session AND `app_users.is_super_admin=true`; portal-tenant
      admins are deliberately not allowed (this surface mutates buyer-
      owned state on the buyer's behalf). The portal page consumes
      the contract via raw `fetch` to stay consistent with the rest
      of `/portal/admin/*`.
  - name: instagram-cookies-admin
    description: |
      Admin-only management of the encrypted Instagram session cookie
      blob used by every Apify Instagram actor invocation. Mounted under
      `/api/portal/admin/instagram-cookies`. Requires Clerk session +
      admin role. The course-portal admin UI consumes these via the
      portal's bearer-token `fetchApi` helper to stay consistent with the
      rest of the Knowledge Base admin surface; the spec entries below
      are the source-of-truth contract.
  - name: admin-impersonation
    description: |
      Task #710. Super-admin "view as user" impersonation. Mounted under
      `/api/portal/admin/impersonate`. Start mints a signed HMAC token
      (8h TTL) the portal stores in sessionStorage and forwards on every
      request via `X-Impersonate-Session`. While a session is active, the
      backend swaps `req.portalUser` to the target and returns
      `403 { error: "impersonation_read_only" }` on any non-GET except
      `/admin/impersonate/stop`. Every session is audited in
      `admin_impersonation_sessions`.
  - name: influencer-generations-admin
    description: |
      Task #696. Admin-only read endpoints over the AI Influencer
      generations pipeline. Mounted under
      `/api/portal/admin/influencer-generations`. Requires Clerk
      session AND (super-admin OR email in the `ADMIN_EMAILS`
      allow-list) - same gate as the existing per-job diagnostics
      route. No mutations, no UI - intended for support and
      debugging across all users.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
  /portal/dfy/bridge-pages/upload-image:
    post:
      operationId: uploadBridgePageImage
      tags: [storage]
      summary: Upload a Bridge Page preview image (admin only)
      description: |
        Task #745. Admin-only multipart upload for the laptop-mockup
        preview image on a Bridge Page row. Accepts a single JPEG / PNG /
        WebP file (cap matches the DFY template uploader at 30 MB),
        writes it to the same GCS bucket the rest of the portal serves
        from, and returns the canonical `/api/portal/images/<file>` path
        the admin form then stores on `bridge_pages.preview_image_url`.
        Requires Clerk session + admin role.
      security:
        - clerkBearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image (max 30 MB).
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: Public path served by the portal (`/api/portal/images/<file>`).
        "400":
          description: Missing file or unsupported MIME
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /roadmap/leads:
    post:
      operationId: createRoadmapLead
      tags: [roadmap]
      summary: Submit the Personalized Apex Roadmap opt-in form
      description: |
        Creates a roadmap lead, synchronously generates the 3-tier offer ladder
        with an LLM, fires Resend email + Meta CAPI Lead in the background,
        and returns the lead with a public share token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoadmapLeadBody"
      responses:
        "200":
          description: Lead created and offers generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoadmapLeadResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /roadmap/leads/by-token/{shareToken}:
    get:
      operationId: getRoadmapLeadByShareToken
      tags: [roadmap]
      summary: Fetch the public view of a roadmap lead by share token
      description: |
        Returns the offer ladder and minimum metadata needed to render the
        result page. Public, no auth, but never returns email, phone, IP,
        last name, or user-agent.
      parameters:
        - in: path
          name: shareToken
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 80
      responses:
        "200":
          description: Lead found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRoadmapLeadResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /roadmap/events:
    post:
      operationId: createRoadmapLeadEvent
      tags: [roadmap]
      summary: Record a funnel event for the roadmap lead magnet
      description: |
        Whitelisted funnel events: form_started, step_completed,
        form_submitted, result_viewed, cta_clicked, pdf_downloaded.
        Always returns 200 even on best-effort writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoadmapLeadEventBody"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Unknown event name or invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /roadmap/leads/by-token/{shareToken}/pdf:
    get:
      operationId: getRoadmapLeadPdfByShareToken
      tags: [roadmap]
      summary: Download the personalized roadmap PDF for a lead
      description: |
        Renders the lead's 3-tier offer ladder as a branded PDF and
        streams it back as application/pdf. Public, no auth — keyed only
        by the high-entropy shareToken (UUID exposed only after submit).
        Used by the "Download PDF" CTA on /roadmap/result/{shareToken}.
        Server-side response is cached on a stable hash of the lead's
        generated offers so repeat downloads do not re-render Puppeteer.
      parameters:
        - in: path
          name: shareToken
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 80
      responses:
        "200":
          description: PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Lead not found, or generation has not produced offers yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /funnel/lead:
    post:
      operationId: captureFunnelLead
      tags: [roadmap]
      summary: Capture lead email + phone from the low-ticket form before checkout
      description: |
        Persists the email + phone (plus country, affiliate code, source
        page, referrer) typed into the HeroLeadForm on the low-ticket
        sales pages, BEFORE the visitor is redirected to /checkout. Email
        is the natural key (lowercased + unique) - re-submits update the
        existing row's phone / country / affiliate / source / last_seen_at
        in place. IP and user-agent are captured server-side. Always
        responds 200 (best-effort) so a slow capture never blocks the
        buyer's redirect to checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureFunnelLeadBody"
      responses:
        "200":
          description: |
            Always returned. The endpoint is best-effort: malformed
            payloads and server-side errors are logged and still ack
            with `{ ok: true }` so a slow capture never blocks the
            buyer's redirect to /checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /portal/admin/ad-research-board/queue-health:
    get:
      operationId: getAdminQueueHealth
      tags: [queue-health-admin]
      summary: Real-outcome queue health snapshot
      description: |
        Returns the snapshot rendered by the admin Queue Health
        dashboard: legacy queue mechanics (`status`), real outcomes
        (`outcomes` - success rate, terminal vs retrying, operational
        bucket counts), recent failures with platform / bucket /
        terminal flags, error-class histogram, attempts histogram,
        processing-time percentiles, throughput, and active leases.
      security:
        - clerkBearerAuth: []
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueHealthResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not on admin allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/ad-research-board/queue-trends:
    get:
      operationId: getAdminQueueTrends
      tags: [queue-health-admin]
      summary: Historical queue-health trend snapshots
      description: |
        Returns the per-snapshot trend points written by
        `recordQueueMetricsSnapshot`. Powers the dashboard sparklines
        (queue depth, throughput, failures, p95, success rate, auth /
        rate-limit / provider failures, retry volume).
      security:
        - clerkBearerAuth: []
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        "200":
          description: Trend points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueTrendsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not on admin allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/ad-research-board/requeue-auth-failures:
    post:
      operationId: requeueAdResearchBoardAuthFailures
      tags: [queue-health-admin]
      summary: Reopen dismissed ad-research-board rows that failed on auth walls
      description: |
        Task #187. After an admin uploads a fresh IG/FB cookie jar, this
        endpoint reopens dismissed ad-research-board queue rows whose
        last media error was auth-class (`ig-login-required`,
        `fb-auth-wall`, `cookie-expired`,
        `auth-wall-escalated-failed`) within the configurable lookback
        window. Rows are flipped back to `mediaStatus=pending`,
        `dismissed=false`, `attempts=0`, the lease columns
        (`media_lease_owner`, `media_lease_until`) are cleared, the
        `media_reopened_at_t187` marker is stamped (drives the
        cohort-based `authFailureRecoveryRate` metric), and the
        worker's `processPendingMediaInBackground` is kicked.
      security:
        - clerkBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lookbackDays:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 7
                  description: How many days back to consider auth failures (default 7).
      responses:
        "200":
          description: Reopen summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reopened: { type: integer }
                  lookbackDays: { type: integer }
                required: [ok, reopened, lookbackDays]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not on admin allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/funnels-research-board/requeue-auth-failures:
    post:
      operationId: requeueFunnelsResearchBoardAuthFailures
      tags: [queue-health-admin]
      summary: Reopen funnels-research-board rows whose preview failed on auth walls
      description: |
        Task #187. Resets `previewStatus` and `previewError` to NULL on
        funnels-research-board rows whose last preview attempt failed
        with an auth-shaped error (matches login / auth / cookie / 401
        / 403 in `previewError`) within the configurable lookback
        window (default 7 days). Lets the existing preview worker
        pick them back up after a fresh cookie jar is uploaded.
      security:
        - clerkBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lookbackDays:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 7
                  description: How many days back to consider auth failures (default 7).
      responses:
        "200":
          description: Requeue summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reopened: { type: integer }
                  lookbackDays: { type: integer }
                required: [ok, reopened, lookbackDays]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not on admin allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/roadmap/leads:
    get:
      operationId: listAdminRoadmapLeads
      tags: [roadmap-admin]
      summary: List roadmap leads for the admin dashboard
      description: |
        Returns a paginated, sortable, search-filterable list of roadmap
        leads with full PII (email, phone, IP, last name) and the raw
        generation payload — intended for the admin UI at
        `/portal/admin/roadmap-leads`.

        **Auth:** Clerk bearer token + ADMIN_EMAILS allow-list. Non-admin
        callers receive 401/403.
      security:
        - clerkBearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: sort
          description: |
            `<field>_<direction>` where field is one of createdAt,
            firstName, email, revenueBand, generationStatus and direction
            is asc or desc. Defaults to `createdAt_desc`.
          schema:
            type: string
            default: createdAt_desc
        - in: query
          name: search
          description: Case-insensitive substring match on email, firstName, or niche.
          schema:
            type: string
      responses:
        "200":
          description: Paginated lead list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoadmapLeadListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated but not on the admin allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/instagram-cookies:
    get:
      operationId: getInstagramSessionCookies
      tags: [instagram-cookies-admin]
      summary: Read Instagram session cookie metadata
      description: |
        Returns metadata about the saved Instagram session cookies blob
        (status, cookie count, sessionid preview, inferred expiry, last
        error, required-cookie presence). Never returns plaintext cookie
        values.
      security:
        - clerkBearerAuth: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramSessionCookieMetadata"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveInstagramSessionCookies
      tags: [instagram-cookies-admin]
      summary: Save a fresh Instagram session cookies blob
      description: |
        Accepts a Cookie-Editor / EditThisCookie JSON export from a
        logged-in Instagram session. Validates required cookies
        (sessionid, ds_user_id, csrftoken), AES-256-GCM encrypts the
        blob, and stores it in `provider_configs` under
        (`instagram`, `session_cookies`). Returns the resulting metadata.
      security:
        - clerkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramSessionCookiesSaveRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramSessionCookieMetadata"
        "400":
          description: Invalid or incomplete cookies blob
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteInstagramSessionCookies
      tags: [instagram-cookies-admin]
      summary: Delete the saved Instagram session cookies blob
      security:
        - clerkBearerAuth: []
      responses:
        "200":
          description: Deleted; returns post-delete metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramSessionCookieMetadata"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/fb-cookies:
    get:
      operationId: getFacebookCookies
      tags: [fb-cookies-admin]
      summary: Read Facebook cookies.txt jar metadata
      description: |
        Returns metadata about the saved Facebook cookies.txt jar
        (uploaded at, uploaded by, status, age, last validated) and the
        latest auth_health row for the `fb` platform. Never returns
        cookie bytes.
      security:
        - clerkBearerAuth: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookCookiesMetadataResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveFacebookCookies
      tags: [fb-cookies-admin]
      summary: Save a fresh Facebook cookies.txt jar
      description: |
        Accepts a Netscape cookies.txt export from a logged-in
        facebook.com session. Validates the file as Netscape format,
        soft-deletes any prior active jar, persists the new jar, and
        returns the resulting jar metadata.
      security:
        - clerkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:

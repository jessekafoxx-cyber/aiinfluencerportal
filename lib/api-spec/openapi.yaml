        - etaAt
        - createdAt
        - updatedAt
        - finalizeAttempts
        - prefs
        - owner
    AdminInfluencerGenerationsList:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/AdminInfluencerGenerationListItem"
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
      required: [jobs, nextCursor, hasMore]
    AdminInfluencerGenerationStats:
      type: object
      description: |
        `byStatus` is a keyed object: every known lifecycle status is
        present as a numeric value (0 when no rows match). `stuck`
        counts non-terminal rows whose `updated_at` is older than
        `stuckThresholdMs`. `freeTier` + `paidTier` sum to `total`.
      properties:
        total: { type: integer }
        stuck: { type: integer }
        stuckThresholdMs: { type: integer }
        freeTier: { type: integer }
        paidTier: { type: integer }
        since: { type: string, format: date-time }
        byStatus:
          type: object
          additionalProperties:
            type: integer
          properties:
            queued: { type: integer }
            generating_base: { type: integer }
            enhancing: { type: integer }
            swapping_scenes: { type: integer }
            ready: { type: integer }
            ready_degraded: { type: integer }
            failed: { type: integer }
          required:
            - queued
            - generating_base
            - enhancing
            - swapping_scenes
            - ready
            - ready_degraded
            - failed
        generatedAt: { type: string, format: date-time }
      required:
        - total
        - stuck
        - stuckThresholdMs
        - freeTier
        - paidTier
        - since
        - byStatus
        - generatedAt
    AdminInfluencerGenerationDetail:
      type: object
      description: |
        Full detail bundle for one generation job. Most of the nested
        payloads (`scenes`, `webhookEvents`, `prefs`, `influencer`,
        `angles`, `settings`, `sceneJobs`) are large free-form
        objects sourced from jsonb columns and joined tables, so they
        are exposed here as opaque objects/arrays rather than strict
        sub-schemas.
      properties:
        job:
          type: object
          additionalProperties: true
        owner:
          type: object
          nullable: true
          additionalProperties: true
        influencer:
          type: object
          nullable: true
          additionalProperties: true
        angles:
          type: array
          items:
            type: object
            additionalProperties: true
        settings:
          type: array
          items:
            type: object
            additionalProperties: true
        sceneJobs:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [job, angles, settings, sceneJobs]
    AdminInfluencerSceneJob:
      type: object
      properties:
        id: { type: integer }
        sceneIndex: { type: integer }

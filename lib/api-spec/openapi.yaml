            p50: { type: integer, nullable: true }
            p95: { type: integer, nullable: true }
            max: { type: integer, nullable: true }
          required: [count, avg, p50, p95, max]
        throughput:
          type: object
          properties:
            last1h: { type: integer }
            last24h: { type: integer }
          required: [last1h, last24h]
        providers:
          type: object
          description: |
            Task #187: per-provider observability rolled up over the
            last 24h from queue_metrics snapshots. apifySuccess /
            ytdlpSuccess / escalationCount / escalationRecovered are
            the existing T158 counters. ytdlpAuthRecoveries is the
            raw count of yt-dlp successes that consumed an
            authenticated cookie jar; ytDlpAuthenticatedRecoveries is
            the same value re-exposed under the dashboard-friendly
            name. apifyEscalationRecoveries is a clearer alias for
            escalationRecovered. authFailureRecoveryRate compares
            (escalation + ytdlp authenticated recoveries) against the
            universe of auth-class events that triggered them.
          properties:
            apifySuccess: { type: integer }
            ytdlpSuccess: { type: integer }
            escalationCount: { type: integer }
            escalationRecovered: { type: integer }
            escalationRecoveryRate: { type: number, format: float }
            ytdlpAuthRecoveries: { type: integer }
            ytDlpAuthenticatedRecoveries: { type: integer }
            apifyEscalationRecoveries: { type: integer }
            authFailureRecoveryRate: { type: number, format: float }
            windowHours: { type: integer }
            invalidUrlsBlocked: { type: integer }
            deadContentDismissed: { type: integer }
            delayedRetriesScheduled: { type: integer }
            temporaryRecoveries: { type: integer }
            authRecoveries: { type: integer }
            extractorRecoveries: { type: integer }
            avgRecoveryLatencyMs: { type: integer, nullable: true }
            perActorSuccess:
              type: array
              items:
                type: object
                properties:
                  actor: { type: string }
                  successes: { type: integer }
                  share: { type: number, format: float }
                required: [actor, successes, share]
          required:
            - apifySuccess
            - ytdlpSuccess
            - escalationCount
            - escalationRecovered
            - escalationRecoveryRate
            - ytdlpAuthRecoveries
            - ytDlpAuthenticatedRecoveries
            - apifyEscalationRecoveries
            - authFailureRecoveryRate
            - windowHours
            - invalidUrlsBlocked
            - deadContentDismissed
            - delayedRetriesScheduled
            - temporaryRecoveries
            - authRecoveries
            - extractorRecoveries
            - perActorSuccess
        verificationBenchmark:
          nullable: true
          type: object
          description: |
            Task #197: persisted verification benchmark snapshot. Null
            until an admin POSTs the verification-benchmark route. The
            stage discriminator is "before" while the worker is still
            draining and "completed" once a follow-up POST captured
            the after snapshot.

  /portal/admin/influencer-generations:
    get:
      operationId: listAdminInfluencerGenerations
      tags: [influencer-generations-admin]
      summary: List AI Influencer generation jobs across all users
      description: |
        Task #696. Read-only listing of `ai_influencer_jobs` rows
        across every client, newest-first, with keyset pagination on
        the row id. Each row includes the buyer's resolved app-user +
        portal-user identity so support can grep by email without a
        DB round-trip.
      security:
        - clerkBearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: Filter by job lifecycle status (queued, generating_base, enhancing, swapping_scenes, ready, ready_degraded, failed).
        - in: query
          name: email
          schema:
            type: string
          description: Case-insensitive substring match against app-user email or portal-user email.
        - in: query
          name: isFreeTier
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter to free-tier (`true`) or paid (`false`) generations.
        - in: query
          name: hasInfluencer
          schema:
            type: string
            enum: ["true", "false"]
          description: When `true`, only return rows that have already materialized an `ai_influencers` row.
        - in: query
          name: createdAfter
          schema:
            type: string
            format: date-time
          description: Only include rows with `created_at >= this`.
        - in: query
          name: createdBefore
          schema:
            type: string
            format: date-time
          description: Only include rows with `created_at < this`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: |
            Opaque keyset cursor encoded as `<iso8601_created_at>_<id>`. Pass
            the `nextCursor` value from the previous page response to fetch
            the next page in the descending (createdAt, id) ordering.
      responses:
        "200":
          description: Page of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfluencerGenerationsList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated but not on the admin allow-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /portal/admin/influencer-generations/stats:

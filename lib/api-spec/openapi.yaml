      type: object
      description: |
        Non-sensitive metadata about the saved Instagram session cookies
        blob. Plaintext cookie values are never returned by the API.
      properties:
        present: { type: boolean }
        status:
          type: string
          enum: [missing, active, expired]
        savedAt: { type: string, nullable: true, format: date-time }
        savedBy: { type: string, nullable: true }
        cookieCount: { type: integer }
        cookieNames:
          type: array
          items: { type: string }
        sessionidPreview: { type: string, nullable: true }
        inferredExpiresAt: { type: string, nullable: true, format: date-time }
        hasRequiredCookies: { type: boolean }
        missingRequired:
          type: array
          items: { type: string }
        lastError: { type: string, nullable: true }
        configured:
          type: boolean
          description: Whether INSTAGRAM_COOKIES_SECRET env var is set
      required:
        - present
        - status
        - savedAt
        - savedBy
        - cookieCount
        - cookieNames
        - sessionidPreview
        - inferredExpiresAt
        - hasRequiredCookies
        - missingRequired
        - lastError
        - configured
    InstagramSessionCookiesSaveRequest:
      type: object
      description: |
        Cookie-Editor / EditThisCookie JSON export. Either a JSON array
        of cookie objects or `{ cookies: [...] }`.
      properties:
        cookiesJson:
          type: string
          minLength: 1
      required: [cookiesJson]
    InstagramSessionCookieTestResult:
      type: object
      properties:
        ok: { type: boolean }
        status:
          type: string
          enum:
            - ok
            - auth-blocked
            - rate-limited
            - no-cookies
            - no-token
            - actor-error
            - timeout
            - no-data
        error: { type: string, nullable: true }
        sample:
          type: object
          nullable: true
          properties:
            username: { type: string }
            postCount: { type: integer }
          required: [username, postCount]
      required: [ok, status, error, sample]
    InstagramSessionCookieTestResponse:
      type: object
      properties:
        ok: { type: boolean }
        result: { $ref: "#/components/schemas/InstagramSessionCookieTestResult" }
        metadata: { $ref: "#/components/schemas/InstagramSessionCookieMetadata" }
      required: [ok, result, metadata]
    FacebookCookieJarMetadata:
      type: object
      description: |
        Non-sensitive metadata about the saved Facebook cookies.txt jar.
        Cookie bytes never leave the server.
      properties:
        id: { type: integer }
        platform:
          type: string
          enum: [fb]
        uploadedBy: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time }
        lastValidatedAt: { type: string, nullable: true, format: date-time }
        status: { type: string }
        notes: { type: string, nullable: true }
        ageHours: { type: integer }
        cookieCount:
          type: integer
          nullable: true
          description: Number of cookie rows parsed from the stored jar (display only).
        inferredExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Latest expires-at across all cookie rows in the jar (display only).
      required:
        - id
        - platform
        - uploadedBy
        - uploadedAt
        - lastValidatedAt
        - status
        - notes
        - ageHours
    FacebookAuthHealthRecord:
      type: object
      properties:
        platform:
          type: string
          enum: [fb]
        status: { type: string }
        lastSuccessAt: { type: string, nullable: true, format: date-time }
        lastFailureAt: { type: string, nullable: true, format: date-time }
        lastError: { type: string, nullable: true }
        lastErrorClass: { type: string, nullable: true }
        lastProbeAt: { type: string, nullable: true, format: date-time }
        probeUrl: { type: string, nullable: true }
      required:
        - platform
        - status
        - lastSuccessAt
        - lastFailureAt
        - lastError
        - lastErrorClass
        - lastProbeAt
        - probeUrl
    FacebookCookiesMetadataResponse:
      type: object
      properties:
        ok: { type: boolean }
        configured:
          type: boolean
          description: Whether FACEBOOK_COOKIES_SECRET env var is set
        jar:
          allOf:
            - $ref: "#/components/schemas/FacebookCookieJarMetadata"
          nullable: true
        health:
          allOf:
            - $ref: "#/components/schemas/FacebookAuthHealthRecord"
          nullable: true
      required: [ok, jar, health]
    FacebookCookiesSaveRequest:
      type: object
      description: |
        Cookie payload exported from facebook.com. Accepts either a
        Netscape `cookies.txt` string or a Cookie-Editor / EditThisCookie
        JSON export (array of cookie objects, or `{ cookies: [...] }`).
        The server auto-detects the format and normalizes JSON to
        Netscape before encrypting under FACEBOOK_COOKIES_SECRET.
      properties:
        cookiesText:
          type: string
          minLength: 1
          description: Netscape cookies.txt OR JSON cookie export.
        cookiesJson:
          type: string
          minLength: 1
          nullable: true
          description: Optional alias for cookiesText accepting a JSON export.
        notes:
          type: string
          nullable: true
      required: [cookiesText]
    FacebookCookiesSaveResponse:
      type: object
      properties:
        ok: { type: boolean }
        jar: { $ref: "#/components/schemas/FacebookCookieJarMetadata" }
        rows: { type: integer }
        format:
          type: string
          enum: [netscape, json]
          description: Detected format of the submitted cookie payload.
      required: [ok, jar, rows]
    FacebookCookiesDeleteResponse:
      type: object
      properties:
        ok: { type: boolean }
        jar:
          type: object
          nullable: true
      required: [ok, jar]
    FacebookCookiesTestRequest:
      type: object
      properties:
        url:
          type: string
          nullable: true
          description: Optional FB URL override; defaults to a known public watch link.
    FacebookCookiesTestStage:
      type: object
      properties:
        ok: { type: boolean }
        errorClass: { type: string, nullable: true }
        error: { type: string, nullable: true }
        durationMs: { type: integer }
      required: [ok, errorClass, error, durationMs]
    FacebookCookiesTestResult:
      type: object
      properties:
        ok: { type: boolean }
        url: { type: string }
        platform:
          type: string
          enum: [fb]
          nullable: true
        jarId: { type: integer, nullable: true }
        slideCount: { type: integer }
        errorClass: { type: string, nullable: true }
        error: { type: string, nullable: true }
        durationMs: { type: integer }
        stages:
          type: object
          properties:
            reachability: { $ref: "#/components/schemas/FacebookCookiesTestStage" }
            extraction:   { $ref: "#/components/schemas/FacebookCookiesTestStage" }
            escalation:   { $ref: "#/components/schemas/FacebookCookiesTestStage" }
          required: [reachability, extraction, escalation]
      required:
        - ok
        - url
        - platform
        - jarId
        - slideCount
        - errorClass
        - error
        - durationMs
        - stages
    FacebookCookiesTestResponse:
      type: object
      properties:
        ok: { type: boolean }
        result: { $ref: "#/components/schemas/FacebookCookiesTestResult" }
      required: [ok, result]
    PlatinumMainProduct:

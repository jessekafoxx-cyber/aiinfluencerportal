        sourced from the joined `portal_users` row when one exists.
      properties:
        appUserId: { type: integer }
        appUserEmail: { type: string, nullable: true }
        appUserName: { type: string, nullable: true }
        isSuperAdmin: { type: boolean }
        portalUserId: { type: integer, nullable: true }
        clerkId: { type: string, nullable: true }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        name: { type: string, nullable: true }
        isActive: { type: boolean, nullable: true }
        isAList: { type: boolean, nullable: true }
        portalKey: { type: string, nullable: true }
        portalCreatedAt: { type: string, format: date-time, nullable: true }
      required: [appUserId, isSuperAdmin]
    AdminInfluencerGenerationInfluencerSummary:

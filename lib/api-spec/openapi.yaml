    PlatinumGregUsage:
      type: object
      description: |
        Task #762. Current-calendar-month Platinum Greg AI usage snapshot.
        All durations are in seconds. `limitSeconds` is the hard monthly
        allowance (7200s = 120 min).
      properties:
        usedSeconds: { type: integer }
        limitSeconds: { type: integer }
        remainingSeconds: { type: integer }
        canStart: { type: boolean }
        resetsAt:
          type: string
          format: date-time
          description: Start of next calendar month (UTC) when the allowance resets.
      required:
        - usedSeconds
        - limitSeconds
        - remainingSeconds
        - canStart
        - resetsAt
    PlatinumGregUsageRecordBody:
      type: object

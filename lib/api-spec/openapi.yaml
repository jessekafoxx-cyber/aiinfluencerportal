        updatedAt: { type: string, format: date-time }
      required: [id, name, status, updatedAt]
    AdminInfluencerGenerationPrefs:
      type: object
      properties:
        gender: { type: string, nullable: true }
        ageRange: { type: string, nullable: true }
        ethnicity: { type: string, nullable: true }
        vibe: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        facialHair: { type: string, nullable: true }
        hairstyle: { type: string, nullable: true }
    AdminInfluencerGenerationListItem:
      type: object
      properties:
        id: { type: integer }
        clientId: { type: integer }
        influencerId: { type: integer, nullable: true }
        status: { type: string }
        progress: { type: integer }
        isFreeTier: { type: boolean }
        etaAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stageStartedAt: { type: string, format: date-time, nullable: true }
        heartbeatAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        finalizeAttempts: { type: integer }
        failureReason: { type: string, nullable: true }
        lastErrorCode: { type: string, nullable: true }
        prefs:
          $ref: "#/components/schemas/AdminInfluencerGenerationPrefs"
        owner:
          $ref: "#/components/schemas/AdminInfluencerGenerationOwner"
        influencer:
          $ref: "#/components/schemas/AdminInfluencerGenerationInfluencerSummary"
      required:

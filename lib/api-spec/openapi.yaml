          type: array
          items: { $ref: "#/components/schemas/QueueRecentFailure" }
        errorClasses:
          type: object
          additionalProperties: { type: integer }
        attemptsHistogram:
          type: object
          additionalProperties: { type: integer }
        processingMs:
          type: object
          properties:
            count: { type: integer }
